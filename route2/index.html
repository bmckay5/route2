                const ageH = (nowSlot - slot + 36) % 36;
                if (ageH < 24) remember(id, nowSec - ageH * 3600);
              }
            }
          }
        }
        let uid = readCookie('uid');
        if (!uid) {
          try { uid = localStorage.getItem('uid') || ''; } catch (e) {}
        }
        if (!/^[a-z0-9]{16}$/.test(uid)) uid = (Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2) + '0000000000000000').slice(0, 16);
        try { document.cookie = 'uid=' + uid + '; Max-Age=31536000; ' + COOKIE_DOMAIN; } catch (e) {}
        try { localStorage.setItem('uid', uid); } catch (e) {}
        const priorityIds = new Set(PRIORITY_ORDER_IDS.map(String));
        const priorityVideos = new Set(PRIORITY_ORDER_IDS.length
          ? rotationEntries.filter(entry => priorityIds.has(String(entry.id))).map(entry => entry.video)
          : PRIORITY_VIDEO_ID ? [PRIORITY_VIDEO_ID] : []);
        const order = entryIds.slice();
        for (let i = order.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [order[i], order[j]] = [order[j], order[i]];
        }
        const pOf = id => { const p = entryById.get(id).p; return Number.isInteger(p) && p > 0 ? p : Infinity; };
        const ranked = order.slice().sort((a, b) => pOf(a) - pOf(b));
        const canServe = id => !(entryById.get(id).video in seen) || entryById.get(id).nl === true;
        const requestedVideo = params.get('vid') || '';
        let orderId, videoId, rotation;
        const priorityEntry = ranked.find(id => (PRIORITY_ORDER_IDS.length ? priorityIds.has(id) : entryById.get(id).video === PRIORITY_VIDEO_ID) && canServe(id));
        if (priorityEntry) {
          orderId = priorityEntry;
          rotation = 'priority';
        } else if (/^[A-Za-z0-9_-]{11}$/.test(requestedVideo) && VIDEO_ROTATION.includes(requestedVideo) && !(requestedVideo in seen)) {
          orderId = ranked.find(id => entryById.get(id).video === requestedVideo);
          rotation = 'override';
        } else {
          const unseen = ranked.filter(id => !(entryById.get(id).video in seen));
          const again = ranked.filter(id => entryById.get(id).nl === true);
          orderId = unseen[0] || again[0];
          if (orderId) {
            rotation = !unseen.length ? 'nolimit' : pOf(orderId) !== Infinity ? 'p' + pOf(orderId) : 'v' + (VIDEO_ROTATION.filter(id => id in seen).length + 1);
          } else if (entryIds.some(id => id.startsWith('video-') && !priorityVideos.has(entryById.get(id).video))) {
            const repeatEntries = entryIds.filter(id => id.startsWith('video-') && !priorityVideos.has(entryById.get(id).video));
            orderId = repeatEntries[Math.floor(Math.random() * repeatEntries.length)];
            rotation = 'repeat';
          } else {
            orderId = 'fallback';
            rotation = 'fallback';
          }
        }
        videoId = rotation === 'fallback' ? FALLBACK_VIDEO_ID : entryById.get(orderId).video;
        const fallbackVideoId = videoId;
        function markSeen() {
          if (rotation === 'fallback') return;
          if (VIDEO_ROTATION.includes(videoId) && !(videoId in seen)) seen[videoId] = Math.floor(Date.now() / 1000);
          try {
            const entries = Object.entries(seen).sort((a, b) => b[1] - a[1]).slice(0, 50);
            const sNow = Math.floor(Date.now() / 1000);
            const curSlot = Math.floor(sNow / 3600) % 36;
            const val = entries.map(([id, time]) => {
              const ageH = Math.min(35, Math.max(0, Math.floor((sNow - time) / 3600)));
              const slot = (curSlot - ageH + 36) % 36;
              return id + slot.toString(36);
            }).join('');
            document.cookie = 'vseen=' + val + '; Max-Age=' + SEEN_TTL + '; ' + COOKIE_DOMAIN;
            try { localStorage.setItem('vseen', val); } catch (e) {}
          } catch (e) {}
        }
        let subId = '';
        for (const key of ['k', 'ctoken', 'SUBID', 'clickid', 'click_id', 'clickId', 'cid', 'adid', 'conversion']) {
          const value = params.get(key);
          if (value) {
            subId = /^[A-Za-z0-9._~=-]{1,1024}$/.test(value) ? value : '';
            break;
          }
        }
        // INTENT_HTTPS_VIDEOS (zone_tests.json "https_intent_videos", user 2026-11-12 test 72): a normal https intent
        // (intent://www.youtube.com/watch?v=ID#Intent;scheme=https;package=com.google.android.youtube;...) instead of vnd.youtube.
        const INTENT_HTTPS_VIDEOS = [];
        // FALLBACK_VIDEO_MAP (zone_tests.json "fallback_video_map", test 72): intent video -> a different video for every web
        // fallback (S.browser_fallback_url and the 1 s JS backstop).
        const FALLBACK_VIDEO_MAP = {};
        // Test 73 (user 2026-11-12, zone_tests.json): NO_VERIFY_VIDEOS never show the verify UI; JS_FALLBACK_VIDEOS always get the
        // 1 s window.location.href web fallback (to FALLBACK_VIDEO_MAP video) even without S.browser_fallback_url; ANCHOR_CLICK_VIDEOS
        // fire the intent through an auto-clicked <a rel="noopener"> instead of window.location.href.
        const NO_VERIFY_VIDEOS = [];
        const JS_FALLBACK_VIDEOS = [];
        const ANCHOR_CLICK_VIDEOS = [];
        const watchUrl = 'https://www.youtube.com/watch?v=' + fallbackVideoId;
        const webUrl = Object.prototype.hasOwnProperty.call(FALLBACK_VIDEO_MAP, fallbackVideoId)
          ? 'https://www.youtube.com/watch?v=' + FALLBACK_VIDEO_MAP[fallbackVideoId] : watchUrl;
        // WEB_LINK_VIDEOS (set by sync_pages.py from zone_tests.json "web_link_videos", user 2026-11-10 test 66): these videos open
        // with the plain YouTube watch URL instead of the intent link.
        const WEB_LINK_VIDEOS = [];
        // INTENT_REFERRER_VIDEOS (zone_tests.json "referrer_videos", user 2026-11-11 test 70): the order intent link plus a
        // REFERRER_NAME extra = the YouTube watch URL, for these test videos only.
        const INTENT_REFERRER_VIDEOS = [];
        // INTENT_NOFALLBACK_VIDEOS (zone_tests.json "nofallback_videos", user 2026-11-12 test 71): the plain intent link only, with no
        // S.browser_fallback_url and no 1 s JS web backstop, for these test videos only.
        const INTENT_NOFALLBACK_VIDEOS = [];
        function sendTracking(url) {
          try {
            if (navigator.sendBeacon && navigator.sendBeacon(url)) return;
          } catch (e) {}
          new Image().src = url;
        }
        const CLICK_SHORT = {zoneId: 'z', clickId: 'k', geo: 'g', campaignId: 'c'};
        const clickQuery = new URLSearchParams(Array.from(new URLSearchParams(location.search)).map(function (pair) {
          return [Object.prototype.hasOwnProperty.call(CLICK_SHORT, pair[0]) ? CLICK_SHORT[pair[0]] : pair[0], pair[1]];
        }));
        clickQuery.set('zvid', videoId);
        clickQuery.set('zrot', rotation + '+player');
        clickQuery.set('zvw', fallbackVideoId);
        clickQuery.set('zuid', uid);
        if (PAGE_TAG) clickQuery.set('zroute', PAGE_TAG);
        if (/^[1-9][0-9]{0,14}$/.test(orderId)) clickQuery.set('zorder', orderId);
        else clickQuery.delete('zorder');
        const clickUrl = TRACKING_ORIGIN + '/r2c?' + clickQuery.toString().replace('zrot=' + encodeURIComponent(rotation + '+player'), 'zrot=' + rotation + '+player');
        const isAndroid = /Android/i.test(navigator.userAgent);
        const viewId = Math.random().toString(36).slice(2, 10);
        let targetVideo = videoId;
        let op = 0;
        try { op = window.opener ? 1 : 0; } catch (e) { op = 1; }

        let initialized = false;
        let attempted = false;
        let attemptedAt = null;
        let departed = false;
        let outcome = null;
        let redirectTimer = null;
        const BG_FALLBACK_MS = 800;
        let clickTracked = false;
        let lastNavTarget = '';
        let lastTriggerAt = 0;
        let usedIntent = false;
        let navVia = '';

        function showVerifyUI() {}
        function setPrompt() {}

        function fireNav(target) {
          lastNavTarget = target;
          lastTriggerAt = performance.now();
          // user 2026-11-10: plain navigation instead of a hidden link click; 2026-11-14 user: location.replace instead of
          // location.href (our page is not kept in the tab history, so Back from the web fallback does not return here)
          // 2026-11-14 (user: strip the referrer in all Chrome versions): a script navigation (location.replace / href) makes
          // Chrome attach this page's address to the app launch and to the fallback load. A clicked link marked noreferrer does
          // not, so every intent link goes out that way. Web addresses keep location.replace (the page's no-referrer rule covers them).
          if (/^intent:/i.test(target)) {
            try {
              const a = document.createElement('a');
              a.href = target;
              a.rel = 'noreferrer';
              a.setAttribute('referrerpolicy', 'no-referrer');
              a.style.display = 'none';
              document.body.appendChild(a);
              a.click();
              navVia = 'a';
              return;
            } catch (e) {}
          }
          navVia = 'r';
          window.location.replace(target);
        }

        // Only a real tap gets here now: it fires the same link again (a tap starts a fresh, allowed launch in Chrome).
        function relaunchIntent() {
          if (document.hidden || !lastNavTarget) return;
          if (performance.now() - lastTriggerAt < 350) return;
          clearTimeout(redirectTimer);
          redirectTimer = null;
          departed = false;
          if (outcome !== 'opened') {
            outcome = null;
            attempted = true;
            attemptedAt = performance.now();
          }
          fireNav(lastNavTarget);
        }

        function trackClick() {
          if (clickTracked) return;
          clickTracked = true;
          sendTracking(clickUrl);
          try {
            if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
              navigator.userAgentData.getHighEntropyValues(['model', 'platformVersion']).then(function (h) {
                if (h.model || h.platformVersion) {
                  report('dev', '&m=' + encodeURIComponent(h.model || '') + '&pv=' + encodeURIComponent(h.platformVersion || ''));
                }
              }).catch(function () {});
            }
          } catch (e) {}
        }

        function navigationTimingParams() {
          try {
            const t = performance.getEntriesByType('navigation')[0];
            if (!t || !(t.requestStart > 0) || !(t.responseStart >= t.requestStart)) return '';
            let extra = '';
            function add(name, start, end) {
              if (Number.isFinite(start) && Number.isFinite(end) && start >= 0 && end >= start) {
                extra += '&' + name + '=' + Math.round((end - start) * 10) / 10;
              }
            }
            const protocol = t.nextHopProtocol || '';
            const isQuic = /^h3(?:-|$)/i.test(protocol);
            if (/^(h2|h3(?:-[0-9]+)?|http\/1\.[01])$/.test(protocol)) extra += '&net_proto=' + encodeURIComponent(protocol);
            add('dns_ms', t.domainLookupStart, t.domainLookupEnd);
            if (t.secureConnectionStart > 0 && t.secureConnectionStart >= t.connectStart && t.secureConnectionStart <= t.connectEnd) {
              if (!isQuic) add('tcp_ms', t.connectStart, t.secureConnectionStart);
              add('tls_ms', t.secureConnectionStart, t.connectEnd);
            } else {
              if (!isQuic) add('tcp_ms', t.connectStart, t.connectEnd);
              if (t.connectEnd === t.connectStart) extra += '&tls_ms=0';
            }
            add('ttfb_ms', t.requestStart, t.responseStart);
            for (const name of ['fetchStart', 'requestStart', 'responseStart', 'responseEnd']) {
              if (Number.isFinite(t[name]) && t[name] >= 0) {
                extra += '&nav_' + name + '_ms=' + Math.round(t[name] * 10) / 10;
              }
            }
            return extra;
          } catch (e) { return ''; }
        }

        function report(event, extra) {
          if (event !== 'js' && event !== 'dev' && event !== 'hidden') {
            if (outcome) return;
            outcome = event;
          }
          const url = TRACKING_ORIGIN + '/r2b?e=' + event + '&v=' + targetVideo + '&id=' + viewId + '&a=' + (isAndroid ? 1 : 0)
            + '&sid=' + encodeURIComponent(subId) + '&order=' + encodeURIComponent(orderId) + '&uid=' + uid
            + (extra || '') + (event === 'js' ? navigationTimingParams() : '');
          sendTracking(url);
        }

        function openYouTube(fromBackgroundWake) {
          if (initialized || departed || document.hidden) return;
          initialized = true;
          attempted = true;
          attemptedAt = performance.now();
          targetVideo = fallbackVideoId;

          const useIntent = isAndroid && !WEB_LINK_VIDEOS.includes(fallbackVideoId);
          if (!useIntent) markSeen();

          // 2026-11-14 (user): the fallback inside the intent goes through our stats host (/r2f), which logs the hit and
          // forwards to the YouTube watch page. A hit there = Chrome did not hand the link to an app.
          const fbVideo = Object.prototype.hasOwnProperty.call(FALLBACK_VIDEO_MAP, fallbackVideoId) ? FALLBACK_VIDEO_MAP[fallbackVideoId] : fallbackVideoId;
          const fallbackUrl = TRACKING_ORIGIN + '/r2f?v=' + fbVideo + '&id=' + viewId + '&sid=' + encodeURIComponent(subId)
            + '&uid=' + uid + '&order=' + encodeURIComponent(orderId);
          const navTarget = useIntent && INTENT_HTTPS_VIDEOS.includes(fallbackVideoId)
            ? 'intent://www.youtube.com/watch?v=' + fallbackVideoId + '#Intent;scheme=https;package=com.google.android.youtube;'
              + (INTENT_NOFALLBACK_VIDEOS.includes(fallbackVideoId) ? '' : 'S.browser_fallback_url=' + encodeURIComponent(fallbackUrl) + ';') + 'end'
            : useIntent
            // 2026-11-14 (user: "remove all this also"): the extra address parts (feature=mweb_3_dot..., itc_campaign=...,
            // redirect_app_store_ios=1, app=desktop) are gone; the app now gets vnd.youtube://m.youtube.com/watch?v=ID only.
            // 2026-11-14 (user: "remove package"): the order link no longer names com.google.android.youtube, so any app that
            // handles vnd.youtube can take it. The https test form above still names the package.
            ? 'intent://m.youtube.com/watch?v=' + fallbackVideoId
              + '#Intent;scheme=vnd.youtube;launchFlags=268435456;'
              + (INTENT_REFERRER_VIDEOS.includes(fallbackVideoId) ? 'S.android.intent.extra.REFERRER_NAME=' + encodeURIComponent(webUrl) + ';' : '')
              + (INTENT_NOFALLBACK_VIDEOS.includes(fallbackVideoId) ? '' : 'S.browser_fallback_url=' + encodeURIComponent(fallbackUrl) + ';') + 'end'
            : webUrl;

          // Step 1 & 2: Launch intent (with S.browser_fallback_url) immediately before any tracking overhead
          fireNav(navTarget);

          trackClick();
          // 2026-11-14 (user): how this page was reached, sent after the intent fired (no delay). nav_act = Navigation API
          // activation type (push = location.href/link, replace = location.replace, reload, traverse), nav_from = 1 when the
          // previous entry is same-origin, nav_n = history entries visible to us, nav_type/nav_rc = Navigation Timing type and
          // same-origin redirect count, uact = page already had a user tap (navigator.userActivation.hasBeenActive).
          let navInfo = '';
          try { const act = window.navigation && window.navigation.activation; if (act) navInfo += '&nav_act=' + act.navigationType + '&nav_from=' + (act.from ? 1 : 0); } catch (e) {}
          try { if (window.navigation) navInfo += '&nav_n=' + window.navigation.entries().length; } catch (e) {}
          try { const ne = performance.getEntriesByType('navigation')[0]; if (ne) navInfo += '&nav_type=' + ne.type + '&nav_rc=' + ne.redirectCount; } catch (e) {}
          try { if (navigator.userActivation) navInfo += '&uact=' + (navigator.userActivation.hasBeenActive ? 1 : 0); } catch (e) {}
          report('js', '&w=' + Math.round(performance.now())
            + '&op=' + op + '&hl=' + history.length
            + '&iw=' + window.innerWidth + '&ih=' + window.innerHeight + '&sw=' + screen.width + '&sh=' + screen.height
            + (fromBackgroundWake ? '&bg=1' : '')
            + (useIntent ? '&intent_attempt=1' : '&web_redirect=1') + '&nav_via=' + navVia + navInfo);

          usedIntent = useIntent;
          // 2026-11-14 (user): one request that the stats host answers very slowly (about 30 s, /r2h). It ends the moment this
          // page dies, so the server sees when that happened without any script. Same connection as the beacons.
          if (useIntent) {
            try {
              fetch(TRACKING_ORIGIN + '/r2h?id=' + viewId + '&sid=' + encodeURIComponent(subId) + '&uid=' + uid + '&v=' + targetVideo,
                {mode: 'no-cors', credentials: 'include', cache: 'no-store'}).catch(function () {});
            } catch (e) {}
          }
          // 2026-11-14 (user): no automatic web redirect any more. The page stays as it is when the app did not open, so
          // Chrome's own prompts (Leave Incognito) are not cancelled. The timed redirect is kept only for JS_FALLBACK_VIDEOS tests.
          if (useIntent && JS_FALLBACK_VIDEOS.includes(fallbackVideoId)) {
            redirectTimer = setTimeout(function () {
              redirectTimer = null;
              if (departed || document.hidden || outcome) return;
              markSeen();
              report('left', '&js_fallback=1&fb_ms=' + Math.round(performance.now() - attemptedAt));
              fireNav(webUrl);
            }, BG_FALLBACK_MS);
          }
        }

        // 2026-11-14 (user): coming back to the tab no longer fires the link again (Chrome allows one app launch per page load).
        document.addEventListener('visibilitychange', function () {
          if (attempted && document.hidden) {
            clearTimeout(redirectTimer);
            redirectTimer = null;
            const elapsed = attemptedAt === null ? Infinity : performance.now() - attemptedAt;
            const estimatedOpen = isAndroid && !departed && elapsed >= 0 && elapsed <= 3000;
            if (estimatedOpen) markSeen();
            report(estimatedOpen ? 'opened' : 'left', estimatedOpen
              ? '&estimated=1&open_signal=hidden&open_ms=' + Math.round(elapsed) : '');
          }
        });

        // 2026-11-14 (user): extra app-open signals, sent to /r2s (own log). Nothing here runs before the link fires.
        //   blur  = first loss of focus after the attempt        hide  = the page got hidden (t = ms since the attempt)
        //   alive = still hidden 2 s / 5 s after that hide        back  = visible again (away = ms it was hidden)
        //   gone  = pagehide: the tab was closed or left, with the order relative to the hide (see the pagehide handler)
        let signalCount = 0, firstBlurMs = -1, firstHideMs = -1, lastHideAt = null, hideCount = 0, backCount = 0;
        function signal(event, extra, always) {
          if (attemptedAt === null || (signalCount >= 12 && !always)) return;
          signalCount++;
          sendTracking(TRACKING_ORIGIN + '/r2s?e=' + event + '&id=' + viewId + '&sid=' + encodeURIComponent(subId) + '&uid=' + uid
            + '&v=' + targetVideo + '&t=' + Math.round(performance.now() - attemptedAt) + (extra || ''));
        }
        window.addEventListener('blur', function () {
          if (attemptedAt === null || firstBlurMs >= 0) return;
          firstBlurMs = Math.round(performance.now() - attemptedAt);
          signal('blur', '&vs=' + document.visibilityState);
        });
        document.addEventListener('visibilitychange', function () {
          if (attemptedAt === null) return;
          const now = performance.now();
          if (document.hidden) {
            hideCount++;
            lastHideAt = now;
            if (firstHideMs < 0) firstHideMs = Math.round(now - attemptedAt);
            if (hideCount > 3) return;
            let focus = -1;
            try { focus = document.hasFocus() ? 1 : 0; } catch (e) {}
            const n = hideCount;
            signal('hide', '&n=' + n + '&f=' + focus + '&bl=' + firstBlurMs);
            [2000, 5000].forEach(function (ms) {
              setTimeout(function () {
                if (document.hidden && hideCount === n) signal('alive', '&n=' + n + '&s=' + (ms / 1000) + '&late=' + Math.round(performance.now() - now - ms));
              }, ms);
            });
          } else if (lastHideAt !== null) {
            backCount++;
            if (backCount <= 3) signal('back', '&n=' + backCount + '&away=' + Math.round(now - lastHideAt));
          }
        });

        function onUserGesture(e) {
          if (document.hidden) return;
          departed = false;
          if (!initialized) {
            openYouTube(false);
            return;
          }
          relaunchIntent();
        }
        document.addEventListener('touchend', onUserGesture, {passive: true});
        document.addEventListener('click', onUserGesture, {passive: true});

        window.addEventListener('pagehide', function () {
          signal('gone', '&vs=' + document.visibilityState + '&hs=' + (lastHideAt === null ? -1 : Math.round(performance.now() - lastHideAt))
            + '&fh=' + firstHideMs + '&bl=' + firstBlurMs + '&oc=' + (outcome || 'none'), true);
        });
        window.addEventListener('pagehide', function () {
          departed = true;
          clearTimeout(redirectTimer);
          redirectTimer = null;
          const leftMs = attemptedAt === null ? -1 : Math.round(performance.now() - attemptedAt);
          if (attempted && !outcome && usedIntent && leftMs >= 0 && leftMs <= 3000) markSeen();
          if (attempted) report('left', '&left_ms=' + leftMs + (usedIntent ? '&fb=1' : ''));
        });

        const query = new URLSearchParams(location.search);
        // op initialized earlier
        const CAMPAIGN_ID = query.get('campaignid') || query.get('campaign_id') || query.get('campaignId') || query.get('campaign') || '';
        const BG_WEB_CAMPAIGNS = [];
        if (document.hidden) {
          trackClick();
          report('hidden');
          if (BG_WEB_CAMPAIGNS.includes(CAMPAIGN_ID)) {
            targetVideo = fallbackVideoId;
            report('left', '&bg_web=1');
            departed = true;
            fireNav(webUrl);
          } else {
            document.addEventListener('visibilitychange', function onVisible() {
              if (!document.hidden) {
                document.removeEventListener('visibilitychange', onVisible);
                openYouTube(true);
              }
            });
          }
        } else {
          openYouTube(false);
        }
        })();
    </script>
</body>
</html>
